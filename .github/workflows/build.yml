name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - cim_proto_v7-debug
          - cim_proto_v7-release
          - cim_v0-debug
          - cim_v0-release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          tags: cim-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build firmware (${{ matrix.preset }})
        run: |
          docker run --rm -v "$PWD:/w" -w /w/firmware cim-dev:latest \
            bash -c "cmake --preset ${{ matrix.preset }} && cmake --build --preset ${{ matrix.preset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/**/*.uf2
            build/${{ matrix.preset }}/**/*.elf
          if-no-files-found: error

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host tests
        run: |
          cmake -S firmware/tests/host -B build/host-tests
          cmake --build build/host-tests
          ctest --test-dir build/host-tests --output-on-failure

  tools-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tool tests
        run: |
          pip install pytest
          python -m pytest tools

  # HIL tests (hil/runner) on the bench Pi. Only for pushes to main and manual
  # runs, never for pull requests: the self-hosted runner executes the
  # repository's code on real hardware. See docs/hil/README.md.
  hil:
    needs: firmware
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, hil]
    timeout-minutes: 20
    concurrency:
      group: hil-bench
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-cim_proto_v7-debug
          path: build/cim_proto_v7-debug

      - name: Set up Python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r hil/runner/requirements.txt

      - name: Run HIL tests
        working-directory: hil/runner
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest -v \
            --firmware-dir "$GITHUB_WORKSPACE/build/cim_proto_v7-debug" \
            --junitxml "$GITHUB_WORKSPACE/hil-report.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-report
          path: hil-report.xml
