name: release

# Publishes a GitHub release when a version tag is pushed, see CONTRIBUTING.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  firmware:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        board: [cim_proto_v7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          tags: cim-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build firmware (${{ matrix.board }})
        run: |
          docker run --rm -v "$PWD:/w" -w /w/firmware cim-dev:latest \
            bash -c "cmake --preset ${{ matrix.board }}-release && cmake --build --preset ${{ matrix.board }}-release"

      - name: Package
        run: |
          mkdir -p dist
          find build/${{ matrix.board }}-release \( -name '*.uf2' -o -name '*.elf' \) -exec cp {} dist/ \;
          cd dist && zip -r "../cim-${GITHUB_REF_NAME}-${{ matrix.board }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.board }}
          path: cim-*.zip
          if-no-files-found: error

  publish:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" cim-*.zip \
            --verify-tag --generate-notes $flags \
            --title "$GITHUB_REF_NAME" \
            --notes "Supported board: cim_proto_v7."
