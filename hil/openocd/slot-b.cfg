# OpenOCD config for HIL slot TARGET B (U2) on cim-rpi-hat-v0.
# SWD bit-banged from the Raspberry Pi's GPIOs (BCM numbers on gpiochip0).
# BOOTSEL of this slot is GPIO19, not used here.
#
#   openocd -f hil/openocd/slot-b.cfg -c "program app.elf verify reset exit"

adapter driver linuxgpiod
adapter gpio swclk 6 -chip 0
adapter gpio swdio 13 -chip 0

source [find target/rp2040.cfg]
