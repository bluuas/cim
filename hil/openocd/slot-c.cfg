# OpenOCD config for HIL slot TARGET C (U3) on cim-rpi-hat-v0.
# SWD bit-banged from the Raspberry Pi's GPIOs (BCM numbers on gpiochip0).
# BOOTSEL of this slot is GPIO22, not used here.
#
#   openocd -f hil/openocd/slot-c.cfg -c "program app.elf verify reset exit"

adapter driver linuxgpiod
adapter gpio swclk 27 -chip 0
adapter gpio swdio 23 -chip 0

source [find target/rp2040.cfg]
