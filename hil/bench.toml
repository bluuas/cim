# What is in which slot of the HIL bench (docs/hil/README.md).
# present: reachable over SWD from the Pi. defect: the slot is skipped by
# single-slot tests, with this reason. can = false: the board cannot take part
# in CAN tests between slots (slot_pair fixture).

[slots.a]
openocd = "openocd/slot-a.cfg"
board = "cim_proto_v7"
present = false
note = "board \"full\" does not connect over SWD, see docs/hil/README.md"

[slots.b]
openocd = "openocd/slot-b.cfg"
board = "cim_proto_v7"
present = true

[slots.c]
openocd = "openocd/slot-c.cfg"
board = "cim_proto_v7"
present = true
defect = "defective RP2040 hardware divider (#41)"
